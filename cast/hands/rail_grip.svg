<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420">
  <!-- "You" right hand gripping the rim rail, XIII style. Realistic proportions.
       Skin: lit = lamp mixed 55% toward paper (#EFCEA0); shadow = lit x 0.7 toward navy (#8B7C67).
       Outline 8 px, knuckle creases 2-3 px; one hard shadow shape per finger group; navy wool cuff with knit hatching. -->
  <defs>
    <clipPath id="fingers">
      <path d="M78 190 L98 124 Q104 104 122 112 L132 168 Z"/>
      <path d="M118 182 L128 106 Q136 88 154 98 L160 170 Z"/>
      <path d="M156 176 L162 104 Q172 88 188 100 L192 172 Z"/>
      <path d="M190 176 L200 120 Q210 106 224 118 L222 180 Z"/>
    </clipPath>
    <clipPath id="backhand"><path d="M86 196 C110 166 196 148 236 166 C266 190 272 250 248 300 L222 336 C188 332 138 302 112 264 C98 242 84 218 86 196 Z"/></clipPath>
    <clipPath id="cuff"><path d="M198 322 L276 262 L360 288 L360 420 L262 420 Z"/></clipPath>
  </defs>
  <g stroke="#141414" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
    <!-- thumb, wrapping the near side of the rail -->
    <path d="M128 252 C108 240 86 236 64 238 C46 240 40 260 56 268 C80 278 108 280 134 284 Z" fill="#EFCEA0"/>
    <path d="M56 268 C80 278 108 280 134 284 L128 266 C104 266 82 262 60 256 Z" fill="#8B7C67" stroke="none"/>
    <path d="M88 246 C92 254 92 262 88 270" fill="none" stroke-width="2.5"/>
    <!-- four fingers over the rail (index, middle, ring, little) -->
    <path d="M78 190 L98 124 Q104 104 122 112 L132 168 Z" fill="#EFCEA0"/>
    <path d="M118 182 L128 106 Q136 88 154 98 L160 170 Z" fill="#EFCEA0"/>
    <path d="M156 176 L162 104 Q172 88 188 100 L192 172 Z" fill="#EFCEA0"/>
    <path d="M190 176 L200 120 Q210 106 224 118 L222 180 Z" fill="#EFCEA0"/>
  </g>
  <!-- one hard shadow shape for the finger group (left/underside, away from the lamp) -->
  <g clip-path="url(#fingers)">
    <path d="M60 200 L92 110 L112 112 L128 104 L150 98 L166 102 L184 108 L200 118 L198 140 L172 146 L150 152 L128 158 L106 176 L96 200 Z" fill="#8B7C67"/>
  </g>
  <g stroke="#141414" stroke-linecap="round" fill="none" stroke-width="2.5">
    <!-- finger joint creases -->
    <path d="M94 150 Q104 156 116 150"/>
    <path d="M128 140 Q140 146 152 140"/>
    <path d="M164 138 Q176 144 188 138"/>
    <path d="M200 146 Q210 151 220 146"/>
  </g>
  <!-- redraw finger outlines over the shadow -->
  <g stroke="#141414" stroke-width="8" stroke-linejoin="round" fill="none">
    <path d="M78 190 L98 124 Q104 104 122 112 L132 168"/>
    <path d="M118 182 L128 106 Q136 88 154 98 L160 170"/>
    <path d="M156 176 L162 104 Q172 88 188 100 L192 172"/>
    <path d="M190 176 L200 120 Q210 106 224 118 L222 180"/>
  </g>
  <!-- back of the hand -->
  <path d="M86 196 C110 166 196 148 236 166 C266 190 272 250 248 300 L222 336 C188 332 138 302 112 264 C98 242 84 218 86 196 Z" fill="#EFCEA0"/>
  <g clip-path="url(#backhand)">
    <path d="M70 200 C100 230 130 270 170 300 L222 340 L80 340 Z" fill="#8B7C67"/>
  </g>
  <path d="M86 196 C110 166 196 148 236 166 C266 190 272 250 248 300 L222 336 C188 332 138 302 112 264 C98 242 84 218 86 196 Z" fill="none" stroke="#141414" stroke-width="8" stroke-linejoin="round"/>
  <g stroke="#141414" stroke-linecap="round" fill="none" stroke-width="2.5">
    <!-- knuckle creases and tendons -->
    <path d="M104 192 Q112 186 120 190"/>
    <path d="M138 180 Q147 174 156 178"/>
    <path d="M172 176 Q181 171 190 175"/>
    <path d="M204 180 Q212 176 220 180"/>
    <path d="M150 196 C162 228 182 262 206 292" stroke-width="2"/>
    <path d="M190 192 C200 224 214 256 230 284" stroke-width="2"/>
  </g>
  <!-- navy wool cuff with knit hatching -->
  <path d="M198 322 L276 262 L360 288 L360 420 L262 420 Z" fill="#1B2A41"/>
  <g clip-path="url(#cuff)" stroke="#4A5A6A" stroke-width="2.5" fill="none">
    <path d="M206 330 L284 270"/><path d="M216 340 L294 280"/><path d="M226 350 L304 290"/><path d="M236 360 L314 300"/>
    <path d="M246 370 L324 310"/><path d="M256 380 L334 320"/><path d="M266 390 L344 330"/><path d="M276 400 L354 340"/>
    <path d="M286 410 L364 350"/><path d="M296 420 L374 360"/>
    <path d="M214 318 L222 326 L230 318 L238 326" stroke-width="2"/><path d="M244 298 L252 306 L260 298 L268 306" stroke-width="2"/>
  </g>
  <path d="M198 322 L276 262 L360 288 L360 420 L262 420 Z" fill="none" stroke="#141414" stroke-width="8" stroke-linejoin="round"/>
  <path d="M206 330 L282 272" stroke="#141414" stroke-width="3" fill="none"/>
</svg>
