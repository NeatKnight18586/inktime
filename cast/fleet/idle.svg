  <path d="M104 178 C108 98 292 98 296 178 Z" fill="#1B2A41" stroke="#141414" stroke-width="5" stroke-linejoin="round"/>
  <path d="M96 180 L304 180" stroke="#141414" stroke-width="5" stroke-linecap="round"/>
  <path d="M232 182 C262 188 292 196 320 214 C288 220 254 206 226 192 Z" fill="#1B2A41" stroke="#141414" stroke-width="5" stroke-linejoin="round"/>
  <!-- face -->
  <circle cx="168" cy="232" r="9" fill="#141414"/>
  <circle cx="232" cy="232" r="9" fill="#141414"/>
  <path d="M178 278 L222 278" stroke="#141414" stroke-width="5" stroke-linecap="round"/>
