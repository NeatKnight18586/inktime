    <path d="M176 680 L166 840 L160 985" stroke-width="7"/>
    <path d="M224 680 L236 840 L244 985" stroke-width="7"/>
    <path d="M140 985 L172 985" stroke-width="7"/>
    <path d="M232 985 L266 985" stroke-width="7"/>
    <!-- arms -->
    <path d="M140 390 L104 520 L118 640" stroke-width="7"/>
    <path d="M260 390 L298 515 L286 636" stroke-width="7"/>
