<svg xmlns="http://www.w3.org/2000/svg" width="140" height="350" viewBox="0 0 140 350">
  <!-- Fleet, idle. Hybrid card, units of head diameter D = 100: height 3.5 D, paper-white head, capsule body 0.88 D,
       stick limbs 0.05 D, ink-nub hands 0.12 D, dot eyes 0.075 D spaced 0.27 D, outline 0.06 D brush (+-25%).
       Key light from the right: flat shadow tone + 45 deg hatching (3 px) on the left, 2 px lamp rim on the right.
       Identity: peaked cap, amber scarf, navy coat. -->
  <defs>
    <pattern id="hatch" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect x="0" y="0" width="1.1" height="3" fill="#141414"/>
    </pattern>
    <clipPath id="head"><circle cx="70" cy="62" r="50"/></clipPath>
    <clipPath id="body"><rect x="26" y="112" width="88" height="160" rx="44"/></clipPath>
    <clipPath id="left"><rect x="0" y="0" width="58" height="350"/></clipPath>
  </defs>
  <!-- legs and feet -->
  <g stroke="#141414" stroke-linecap="round" fill="none">
    <path d="M58 262 L55 340" stroke-width="5"/>
    <path d="M82 262 L86 340" stroke-width="5"/>
    <path d="M46 341 L58 341" stroke-width="7"/>
    <path d="M84 341 L97 341" stroke-width="7"/>
    <!-- arms -->
    <path d="M30 140 L20 196 L22 228" stroke-width="5"/>
    <path d="M110 140 L121 194 L118 226" stroke-width="5"/>
  </g>
  <!-- ink-nub hands -->
  <circle cx="22" cy="231" r="6" fill="#141414"/>
  <circle cx="118" cy="229" r="6" fill="#141414"/>
  <!-- capsule body: navy coat -->
  <rect x="26" y="112" width="88" height="160" rx="44" fill="#1B2A41"/>
  <g clip-path="url(#body)">
    <rect x="0" y="100" width="54" height="180" fill="#151E2B"/>
    <rect x="0" y="100" width="54" height="180" fill="url(#hatch)" opacity="0.8"/>
    <path d="M112 128 C116 170 116 230 108 262" stroke="#E8A64B" stroke-width="2" fill="none"/>
  </g>
  <rect x="26" y="112" width="88" height="160" rx="44" fill="none" stroke="#141414" stroke-width="6"/>
  <path d="M30 150 C24 190 25 232 34 256 C27 232 24 190 28 150 Z" fill="#141414" stroke="#141414" stroke-width="3"/>
  <!-- coat buttons -->
  <circle cx="70" cy="170" r="3.2" fill="#E8A64B" stroke="#141414" stroke-width="1.5"/>
  <circle cx="70" cy="200" r="3.2" fill="#E8A64B" stroke="#141414" stroke-width="1.5"/>
  <circle cx="70" cy="230" r="3.2" fill="#E8A64B" stroke="#141414" stroke-width="1.5"/>
  <!-- amber scarf -->
  <path d="M30 112 C50 128 92 128 110 112 L113 128 C92 144 48 144 27 128 Z" fill="#E8A64B" stroke="#141414" stroke-width="5" stroke-linejoin="round"/>
  <path d="M86 134 L98 184 L84 188 L77 138 Z" fill="#E8A64B" stroke="#141414" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M30 114 L50 125 L46 140 L27 128 Z" fill="#B47A38"/>
  <!-- head -->
  <circle cx="70" cy="62" r="50" fill="#F4EFE6"/>
  <g clip-path="url(#head)">
    <path d="M0 0 L46 0 C30 30 30 90 50 130 L0 130 Z" fill="#C9C3BC"/>
    <path d="M0 0 L46 0 C30 30 30 90 50 130 L0 130 Z" fill="url(#hatch)" opacity="0.55"/>
    <path d="M114 46 C121 62 120 80 112 94" stroke="#E8A64B" stroke-width="2" fill="none"/>
  </g>
  <circle cx="70" cy="62" r="50" fill="none" stroke="#141414" stroke-width="6"/>
  <path d="M22 44 C14 62 16 86 30 100 C22 84 20 64 25 46 Z" fill="#141414"/>
  <!-- peaked cap -->
  <path d="M24 40 C26 4 114 4 116 40 Z" fill="#1B2A41" stroke="#141414" stroke-width="6" stroke-linejoin="round"/>
  <path d="M30 38 L44 12 L30 18 Z" fill="#151E2B"/>
  <path d="M20 41 L120 41" stroke="#141414" stroke-width="6" stroke-linecap="round"/>
  <path d="M74 43 C90 47 108 50 126 58 C108 62 88 56 70 48 Z" fill="#141414"/>
  <circle cx="70" cy="24" r="4" fill="#E8A64B" stroke="#141414" stroke-width="1.5"/>
  <!-- face: tapered brows, dot eyes with highlight, one-line mouth -->
  <path d="M50 52 Q57 47 64 51 Q57 49.5 50 52 Z" fill="#141414" stroke="#141414" stroke-width="1.2"/>
  <path d="M76 51 Q83 47 90 52 Q83 49.5 76 51 Z" fill="#141414" stroke="#141414" stroke-width="1.2"/>
  <g id="eyes-open">
    <circle cx="56.5" cy="62" r="3.75" fill="#141414"/>
    <circle cx="83.5" cy="62" r="3.75" fill="#141414"/>
    <circle cx="57.6" cy="60.8" r="1.1" fill="#F4EFE6"/>
    <circle cx="84.6" cy="60.8" r="1.1" fill="#F4EFE6"/>
  </g>
  <g id="eyes-closed" display="none" stroke="#141414" stroke-width="2.2" stroke-linecap="round" fill="none">
    <path d="M52 62 Q56.5 64.5 61 62"/>
    <path d="M79 62 Q83.5 64.5 88 62"/>
  </g>
  <path d="M61 84 Q70 86 80 83" stroke="#141414" stroke-width="3" stroke-linecap="round" fill="none"/>
</svg>
