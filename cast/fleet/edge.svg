<svg xmlns="http://www.w3.org/2000/svg" width="170" height="350" viewBox="0 0 170 350">
  <!-- Fleet, "edge" pose for cam_lookout: back view, leaning out over the rim to frame right.
       Foreground edge silhouette: the right 20 units hold the cap brim, the shoulder and the amber scarf tail.
       Same hybrid rules: D = 100, height 3.5 D, capsule body 0.88 D, stick limbs 0.05 D, outline 0.06 D brush.
       No face (faces only in glance shots). Key light from the right: shadow tone + 45 deg hatching on the left, 2 px lamp rim right. -->
  <defs>
    <pattern id="hatch" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect x="0" y="0" width="1.1" height="3" fill="#141414"/>
    </pattern>
    <clipPath id="head"><circle cx="112" cy="66" r="50"/></clipPath>
    <clipPath id="body"><rect x="44" y="120" width="88" height="165" rx="44" transform="rotate(8 88 285)"/></clipPath>
  </defs>
  <!-- legs -->
  <g stroke="#141414" stroke-linecap="round" fill="none">
    <path d="M70 272 L64 342" stroke-width="5"/>
    <path d="M96 276 L98 342" stroke-width="5"/>
    <path d="M54 343 L66 343" stroke-width="7"/>
    <path d="M96 343 L109 343" stroke-width="7"/>
    <!-- left arm hanging, right arm reaching to the rim -->
    <path d="M64 150 L50 206 L52 236" stroke-width="5"/>
    <path d="M146 150 L160 196 L164 214" stroke-width="5"/>
  </g>
  <circle cx="52" cy="239" r="6" fill="#141414"/>
  <circle cx="164" cy="217" r="6" fill="#141414"/>
  <!-- navy coat, capsule body leaning right -->
  <g transform="rotate(8 88 285)">
    <rect x="44" y="120" width="88" height="165" rx="44" fill="#1B2A41"/>
  </g>
  <g clip-path="url(#body)">
    <rect x="0" y="100" width="84" height="200" fill="#151E2B"/>
    <rect x="0" y="100" width="84" height="200" fill="url(#hatch)" opacity="0.8"/>
    <path d="M150 132 C156 170 154 230 144 270" stroke="#E8A64B" stroke-width="2" fill="none"/>
  </g>
  <g transform="rotate(8 88 285)">
    <rect x="44" y="120" width="88" height="165" rx="44" fill="none" stroke="#141414" stroke-width="6"/>
    <path d="M48 160 C42 200 43 240 52 266 C45 240 42 200 46 160 Z" fill="#141414" stroke="#141414" stroke-width="3"/>
    <!-- coat seam down the back -->
    <path d="M88 150 L88 278" stroke="#141414" stroke-width="2" fill="none"/>
  </g>
  <!-- amber scarf round the neck, tail blowing out to frame right -->
  <path d="M70 116 C92 130 136 128 152 112 L156 128 C136 146 90 148 66 132 Z" fill="#E8A64B" stroke="#141414" stroke-width="5" stroke-linejoin="round"/>
  <path d="M146 124 C156 128 164 132 168 138 L166 168 C160 158 154 150 144 146 Z" fill="#E8A64B" stroke="#141414" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M70 118 L92 130 L88 146 L66 132 Z" fill="#B47A38"/>
  <!-- back of the head, paper white -->
  <circle cx="112" cy="66" r="50" fill="#F4EFE6"/>
  <g clip-path="url(#head)">
    <path d="M40 0 L92 0 C76 30 76 96 96 140 L40 140 Z" fill="#C9C3BC"/>
    <path d="M40 0 L92 0 C76 30 76 96 96 140 L40 140 Z" fill="url(#hatch)" opacity="0.55"/>
    <path d="M156 50 C163 66 162 84 154 98" stroke="#E8A64B" stroke-width="2" fill="none"/>
  </g>
  <circle cx="112" cy="66" r="50" fill="none" stroke="#141414" stroke-width="6"/>
  <path d="M64 48 C56 66 58 90 72 104 C64 88 62 68 67 50 Z" fill="#141414"/>
  <!-- ear -->
  <path d="M156 70 C164 70 165 84 156 86" fill="#F4EFE6" stroke="#141414" stroke-width="3"/>
  <!-- peaked cap from behind, brim jutting right -->
  <path d="M64 46 C66 8 158 8 160 46 Z" fill="#1B2A41" stroke="#141414" stroke-width="6" stroke-linejoin="round"/>
  <path d="M70 44 L86 16 L70 22 Z" fill="#151E2B"/>
  <path d="M60 47 L162 47" stroke="#141414" stroke-width="6" stroke-linecap="round"/>
  <path d="M146 46 C154 46 162 46 169 50 C162 56 152 55 142 52 Z" fill="#141414"/>
</svg>
